name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# The deploy runner never receives repository secrets. Its production .env stays
# only on the VM, outside the repository.
permissions:
  contents: read

jobs:
  test:
    name: Tests and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

  deploy:
    name: Deploy to GCP
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, production]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 20

    steps:
      - name: Update application
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ vars.DEPLOY_PATH }}"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          docker compose build bot dashboard migrate
          docker compose up -d postgres
          docker compose run --rm migrate
          docker compose up -d bot dashboard
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:5000/healthz

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          cd "${{ vars.DEPLOY_PATH }}"
          docker compose ps
          docker compose logs --tail=100 bot dashboard
