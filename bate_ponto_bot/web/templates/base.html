<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard | Bate-Ponto Discord{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20%22100%20100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230b4266%22/><path d=%22M24 29h12v34h24v10H24zm43 0h10v44H67z%22 fill=%22%23f4be2c%22/></svg>">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="nav-brand">
            <span class="brand-copy"><strong>Bate Ponto LL</strong></span>
        </a>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Visão geral</a></li>
            <li><a href="{{ url_for('events_page') }}" class="nav-link {% if request.endpoint == 'events_page' %}active{% endif %}">Auditoria</a></li>
            <li><a href="{{ url_for('export_entries') }}" class="btn btn-secondary btn-sm" title="Exportar todos os registros"><i data-lucide="download"></i> Exportar CSV</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Modal for Timeline Events -->
    <div class="modal-backdrop" id="eventsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalEntryTitle" style="font-size: 1.1rem; font-weight: 600;">Eventos do Registro</h3>
                <button type="button" class="btn btn-secondary btn-sm" data-close-modal>&times;</button>
            </div>
            <div class="modal-body">
                <div class="timeline" id="modalTimeline"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-close-modal>Fechar</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p><strong>Bate Ponto LL</strong> &copy; {{ now().year if now is defined else '2026' }}</p>
    </footer>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
