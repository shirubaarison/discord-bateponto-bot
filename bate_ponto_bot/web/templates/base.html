<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard | Bate-Ponto Discord{% endblock %}</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="https://bate-ponto.com.br/wp-content/uploads/2025/02/cropped-cropped-bate-pontologo-32x32-1-32x32.png" sizes="32x32">
    <link rel="icon" href="https://bate-ponto.com.br/wp-content/uploads/2025/02/cropped-cropped-bate-pontologo-32x32-1-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="https://bate-ponto.com.br/wp-content/uploads/2025/02/cropped-cropped-bate-pontologo-32x32-1-180x180.png">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="nav-brand">
            <img src="https://bate-ponto.com.br/wp-content/uploads/2025/02/cropped-cropped-bate-pontologo-32x32-1-192x192.png" alt="" class="brand-mark" width="36" height="36">
            <span class="brand-copy"><strong>Bate Ponto LL</strong></span>
        </a>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">Visão geral</a></li>
            <li><a href="{{ url_for('events_page') }}" class="nav-link {% if request.endpoint == 'events_page' %}active{% endif %}">Auditoria</a></li>
            <li>
                <button type="button" class="nav-link theme-toggle" data-theme-toggle aria-label="Ativar tema escuro" title="Ativar tema escuro">
                    <i data-lucide="moon" data-theme-icon></i>
                    <span class="sr-only" data-theme-label>Ativar tema escuro</span>
                </button>
            </li>
            <li>
                <form action="{{ url_for('logout') }}" method="POST" class="logout-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="nav-link logout-button">Sair</button>
                </form>
            </li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Modal for Timeline Events -->
    <div class="modal-backdrop" id="eventsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalEntryTitle" style="font-size: 1.1rem; font-weight: 600;">Eventos do Registro</h3>
                <button type="button" class="btn btn-secondary btn-sm" data-close-modal>&times;</button>
            </div>
            <div class="modal-body">
                <div class="timeline" id="modalTimeline"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-close-modal>Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal for dashboard confirmations -->
    <div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmModalTitle">
        <div class="modal-card confirm-modal-card">
            <div class="modal-header">
                <h3 id="confirmModalTitle" style="font-size: 1.1rem; font-weight: 600;">Confirmar ação</h3>
                <button type="button" class="btn btn-secondary btn-sm" data-close-confirm aria-label="Fechar">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirmModalMessage">Tem certeza que deseja continuar?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-close-confirm>Cancelar</button>
                <button type="button" class="btn btn-danger btn-sm" data-confirm-action>Encerrar ponto</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p><strong>Bate Ponto LL</strong> &copy; {{ now().year if now is defined else '2026' }}</p>
    </footer>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
