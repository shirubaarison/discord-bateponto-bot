<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Entrar | Bate-Ponto</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
</head>
<body class="login-page">
    <button type="button" class="theme-toggle login-theme-toggle" data-theme-toggle aria-label="Ativar tema escuro" title="Ativar tema escuro">
        <i data-lucide="moon" data-theme-icon></i>
        <span class="sr-only" data-theme-label>Ativar tema escuro</span>
    </button>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-brand">
                <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" class="login-brand-mark" width="36" height="36">
                <span>Bate-Ponto</span>
            </div>
            <h1 id="login-title">Acesse o painel</h1>
            <p>Entre com sua conta do Discord para ver os servidores que você gerencia.</p>

            {% if error %}
            <div class="login-error" role="alert">{{ error }}</div>
            {% endif %}

            <div class="login-form">
                <a href="{{ url_for('discord_login', next=next_target) }}" class="btn btn-primary btn-discord">
                    <i data-lucide="log-in"></i> Entrar com Discord
                </a>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</body>
</html>
