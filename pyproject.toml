[project]
name = "bate-ponto-discord"
version = "0.1.0"
description = "Bot de bate-ponto para Discord com dashboard web para acompanhar as horas da equipe."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "discord.py>=2.4.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary]>=3.2.0",
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.12",
]

[project.scripts]
bate-ponto-bot = "bate_ponto_bot.bot:main"
bate-ponto-dashboard = "bate_ponto_bot.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bate_ponto_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PERF",
    "PIE",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
